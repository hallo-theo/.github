# auto-merge-eligible — arms GitHub auto-merge on every PR so it merges the
# moment the ruleset's required checks (gates-passed + strict) are green.
# No approval step exists in this flow — pitch-owner decision, 2026-09-03:
# "the approval step must be disabled; automerge must be enabled so that it
# merges automatically after gates-passed and CI all green."
#
# The agentic reviewer (theo-pr-reviewer) still reviews every PR; a
# CHANGES_REQUESTED still blocks the merge via the ruleset until resolved —
# that is a gate producing evidence, not an approval ritual. Nothing needs a
# human click on the happy path.
#
# Exactly TWO hard carve-outs remain, both protecting the rule itself:
#   1. Feedback-lane origin (feedback/* branches, feedback-hub-agent PRs):
#      their content is public widget text — the same hardening that fences it
#      in feedback-implement.yml holds its merges for a human.
#   2. Edits under .github/ (workflows, this file, CODEOWNERS): a PR may not
#      auto-merge changes to the machinery that decides auto-merging —
#      otherwise one PR can no-op the gate and ship itself.
# Removing either is a one-line change and an explicit pitch-owner decision.
#
# front-door/* agent PRs (first-slice, roadmap, ticket work authored by
# theo-sdlc-agent[bot]) left the human carve-out on 2026-09-25 (pitch-owner
# decision, Phase 3): they merge REVIEW-THEN-GREEN — auto-merge is armed only
# when theo-pr-reviewer submits an APPROVED review, and every new commit
# DISARMS it until re-approved, so nothing unreviewed rides an old approval.
# Stricter than the default (which never waits for the review verdict),
# because the origin is stranger free text. Any other author on that branch
# prefix still waits for a human.
#
# Caller (add to pr.yml):
#
#   auto-merge:
#     permissions:
#       contents: write
#       pull-requests: write
#     uses: hallo-theo/.github/.github/workflows/auto-merge-eligible.yml@main
#     secrets:
#       PR_REVIEWER_PRIVATE_KEY: ${{ secrets.PR_REVIEWER_PRIVATE_KEY }}
#
# For the agent-PR path the repo must ALSO call this workflow on review
# events, in a separate workflow file (adding the trigger to pr.yml would
# re-run CI and let a skipped `ci` report a green gates-passed on a sha the
# real gate never tested):
#
#   # .github/workflows/arm-on-approval.yml
#   on:
#     pull_request_review:
#       types: [submitted]
#   jobs:
#     arm:
#       permissions:
#         contents: write
#         pull-requests: write
#       uses: hallo-theo/.github/.github/workflows/auto-merge-eligible.yml@main
#       secrets:
#         PR_REVIEWER_PRIVATE_KEY: ${{ secrets.PR_REVIEWER_PRIVATE_KEY }}
#
# Repo prerequisites: Allow auto-merge ON; ruleset requires gates-passed
# (refused otherwise — auto-merge with no required checks means merge-now).

name: "auto-merge-eligible (reusable)"

on:
  workflow_call:
    secrets:
      PR_REVIEWER_PRIVATE_KEY:
        # Armer identity (pitch-owner decision 2026-09-03): merges are made as
        # theo-pr-reviewer[bot] via an App token, NOT github.token — pushes by
        # github-actions[bot] do not trigger workflows (GitHub anti-recursion),
        # so github.token-armed merges silently skip the deploy. Optional so
        # pre-rollout repos keep merging; the fallback warns loudly.
        required: false

jobs:
  classify:
    if: github.event_name == 'pull_request' || github.event_name == 'pull_request_review'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Recorded trade-off: the reviewer App is also the merge armer — one
      # App, two functions; it keeps contents:write permanently. Chosen over
      # a dedicated agent App for operational simplicity.
      - name: Mint armer token (theo-pr-reviewer)
        id: armer
        continue-on-error: true
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.PR_REVIEWER_APP_ID }}
          private-key: ${{ secrets.PR_REVIEWER_PRIVATE_KEY }}

      - name: Classify and maybe enable auto-merge
        env:
          GH_TOKEN: ${{ steps.armer.outputs.token || github.token }}
          ARMER: ${{ steps.armer.outcome }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          PR_STATE: ${{ github.event.pull_request.state }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          EVENT: ${{ github.event_name }}
          REVIEW_STATE: ${{ github.event.review.state }}
          REVIEWER: ${{ github.event.review.user.login }}
        run: |
          set -euo pipefail
          ineligible() { echo "NOT ELIGIBLE: $1"; echo "### auto-merge: not eligible — $1" >> "$GITHUB_STEP_SUMMARY"; exit 0; }

          # ------------------------------------------------------------------
          # 0. EVENT ROUTING — pull_request events arm trusted-origin PRs the
          #    moment they open; pull_request_review events exist only for the
          #    agent-PR path in step 1 (arm on approval). A non-approval
          #    review never arms anything, and a changes-request on an agent
          #    branch actively DISARMS a stale arm.
          # ------------------------------------------------------------------
          [ "$PR_STATE" = "open" ] || ineligible "PR is not open ($PR_STATE)"
          if [ "$EVENT" = "pull_request_review" ] && [ "$REVIEW_STATE" != "approved" ]; then
            if [ "$REVIEW_STATE" = "changes_requested" ]; then
              case "$HEAD_REF" in
                front-door/*) gh pr merge "$PR" --repo "$REPO" --disable-auto || true ;;
              esac
            fi
            ineligible "review state '$REVIEW_STATE' is not an approval"
          fi

          # ------------------------------------------------------------------
          # 1. ORIGIN — provenance rides the branch prefix. feedback/* (public
          #    widget text) is never eligible, whatever the diff looks like.
          #    front-door/* is agent work built from fenced stranger text: per
          #    the 2026-09-25 pitch-owner decision it merges review-then-green
          #    — armed ONLY by a fresh theo-pr-reviewer APPROVED event,
          #    disarmed on every new commit so an unreviewed push can never
          #    ride an old approval. Other authors on that prefix wait for a
          #    human.
          # ------------------------------------------------------------------
          case "$HEAD_REF" in
            feedback/*) ineligible "untrusted-origin branch prefix ($HEAD_REF)" ;;
            front-door/*)
              [ "$AUTHOR" = "theo-sdlc-agent[bot]" ] \
                || ineligible "front-door/* PR not authored by theo-sdlc-agent ($AUTHOR)"
              if [ "$EVENT" = "pull_request" ]; then
                gh pr merge "$PR" --repo "$REPO" --disable-auto || true
                ineligible "agent PR arms only on a theo-pr-reviewer approval (new commits disarm until re-approved)"
              fi
              [ "$REVIEWER" = "theo-pr-reviewer[bot]" ] \
                || ineligible "approval is not from theo-pr-reviewer ($REVIEWER)"
              ;;
          esac
          case "$AUTHOR" in
            feedback-hub-agent*) ineligible "untrusted-origin author ($AUTHOR)" ;;
          esac

          # ------------------------------------------------------------------
          # 2. GUARD — refuse when the ruleset requires no status checks:
          #    enabling auto-merge there would mean "merge immediately".
          # ------------------------------------------------------------------
          required=$(gh api "repos/$REPO/rules/branches/$(gh api "repos/$REPO" -q .default_branch)" \
            -q '[.[] | select(.type=="required_status_checks")] | length')
          [ "$required" -ge 1 ] || ineligible "repo has no required status checks — auto-merge would bypass everything"

          # ------------------------------------------------------------------
          # 3. PATHS — default is ELIGIBLE. The only ineligible paths are the
          #    gate's own machinery: .github/** (workflows incl. this rule
          #    set) — one PR must not be able to no-op the gate and ship
          #    itself. Everything else merges on green, per the 2026-09-03
          #    pitch-owner decision.
          # ------------------------------------------------------------------
          gh api "repos/$REPO/pulls/$PR/files" --paginate -q '.[].filename' > /tmp/files
          [ -s /tmp/files ] || ineligible "empty diff"
          echo "changed files:"; sed 's/^/  /' /tmp/files

          bad=""
          while IFS= read -r f; do
            case "$f" in
              .github/*) bad="$f"; break ;;
            esac
          done < /tmp/files
          [ -z "$bad" ] || ineligible "gate machinery touched: $bad — a human merges changes to the thing that decides merging"

          # ------------------------------------------------------------------
          # 4. ELIGIBLE — enable auto-merge (merge method: merge commit).
          #    The PR merges only when the ruleset's required checks pass.
          # ------------------------------------------------------------------
          if [ "${ARMER:-}" != "success" ]; then
            echo "::warning::armed with github.token — this merge will NOT trigger push workflows (deploy). Install theo-pr-reviewer here and scope org secret PR_REVIEWER_PRIVATE_KEY + org var PR_REVIEWER_APP_ID to this repo."
            echo "### ⚠️ armed with github.token — DEPLOY WILL NOT AUTO-TRIGGER" >> "$GITHUB_STEP_SUMMARY"
          fi
          gh pr merge "$PR" --repo "$REPO" --auto --merge
          echo "### auto-merge: ENABLED (default-on — merges when gates-passed is green)" >> "$GITHUB_STEP_SUMMARY"
          echo "ELIGIBLE — auto-merge enabled; the ruleset decides from here."
