# auto-merge-eligible — arms GitHub auto-merge on every PR so it merges the
# moment the ruleset's required checks (gates-passed + strict) are green.
# No approval step exists in this flow — pitch-owner decision, 2026-09-03:
# "the approval step must be disabled; automerge must be enabled so that it
# merges automatically after gates-passed and CI all green."
#
# The agentic reviewer (theo-pr-reviewer) still reviews every PR; a
# CHANGES_REQUESTED still blocks the merge via the ruleset until resolved —
# that is a gate producing evidence, not an approval ritual. Nothing needs a
# human click on the happy path.
#
# Exactly TWO carve-outs remain, both protecting the rule itself:
#   1. Untrusted-origin branches (feedback/*, front-door/*): their content is
#      public, LLM-processed text — the same hardening that fences it in
#      feedback-implement.yml holds its merges for a human.
#   2. Edits under .github/ (workflows, this file, CODEOWNERS): a PR may not
#      auto-merge changes to the machinery that decides auto-merging —
#      otherwise one PR can no-op the gate and ship itself.
# Removing either is a one-line change and an explicit pitch-owner decision.
#
# Caller (add to pr.yml):
#
#   auto-merge:
#     permissions:
#       contents: write
#       pull-requests: write
#     uses: hallo-theo/.github/.github/workflows/auto-merge-eligible.yml@main
#
# Repo prerequisites: Allow auto-merge ON; ruleset requires gates-passed
# (refused otherwise — auto-merge with no required checks means merge-now).

name: "auto-merge-eligible (reusable)"

on:
  workflow_call: {}

jobs:
  classify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Classify and maybe enable auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          ineligible() { echo "NOT ELIGIBLE: $1"; echo "### auto-merge: not eligible — $1" >> "$GITHUB_STEP_SUMMARY"; exit 0; }

          # ------------------------------------------------------------------
          # 1. ORIGIN — untrusted-origin PRs are never eligible, whatever the
          #    diff looks like. Branch prefixes are the provenance carrier:
          #    feedback/* comes from public widget text (feedback-implement),
          #    front-door/* first slices come from stranger free text.
          # ------------------------------------------------------------------
          case "$HEAD_REF" in
            feedback/*|front-door/*) ineligible "untrusted-origin branch prefix ($HEAD_REF)" ;;
          esac
          case "$AUTHOR" in
            feedback-hub-agent*) ineligible "untrusted-origin author ($AUTHOR)" ;;
          esac

          # ------------------------------------------------------------------
          # 2. GUARD — refuse when the ruleset requires no status checks:
          #    enabling auto-merge there would mean "merge immediately".
          # ------------------------------------------------------------------
          required=$(gh api "repos/$REPO/rules/branches/$(gh api "repos/$REPO" -q .default_branch)" \
            -q '[.[] | select(.type=="required_status_checks")] | length')
          [ "$required" -ge 1 ] || ineligible "repo has no required status checks — auto-merge would bypass everything"

          # ------------------------------------------------------------------
          # 3. PATHS — default is ELIGIBLE. The only ineligible paths are the
          #    gate's own machinery: .github/** (workflows incl. this rule
          #    set) — one PR must not be able to no-op the gate and ship
          #    itself. Everything else merges on green, per the 2026-09-03
          #    pitch-owner decision.
          # ------------------------------------------------------------------
          gh api "repos/$REPO/pulls/$PR/files" --paginate -q '.[].filename' > /tmp/files
          [ -s /tmp/files ] || ineligible "empty diff"
          echo "changed files:"; sed 's/^/  /' /tmp/files

          bad=""
          while IFS= read -r f; do
            case "$f" in
              .github/*) bad="$f"; break ;;
            esac
          done < /tmp/files
          [ -z "$bad" ] || ineligible "gate machinery touched: $bad — a human merges changes to the thing that decides merging"

          # ------------------------------------------------------------------
          # 4. ELIGIBLE — enable auto-merge (merge method: merge commit).
          #    The PR merges only when the ruleset's required checks pass.
          # ------------------------------------------------------------------
          gh pr merge "$PR" --repo "$REPO" --auto --merge
          echo "### auto-merge: ENABLED (default-on — merges when gates-passed is green)" >> "$GITHUB_STEP_SUMMARY"
          echo "ELIGIBLE — auto-merge enabled; the ruleset decides from here."
