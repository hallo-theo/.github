# Reusable PR workflow for hallo theo apps with a Python backend and/or a
# TypeScript (React + Vite) frontend, plus optional Terraform and a docker
# build sanity check.
#
# Each app's caller workflow looks like:
#
#   name: PR
#   on:
#     pull_request:
#       branches: [main]
#   concurrency:
#     group: pr-${{ github.event.pull_request.number }}
#     cancel-in-progress: true
#   jobs:
#     ci:
#       uses: hallo-theo/.github/.github/workflows/python-ts-pr.yml@main
#       with:
#         api-path: api
#         api-package: object-details-api
#         app-path: app/object_details.raw_app
#         terraform-path: terraform                    # optional
#         dockerfile: api/Dockerfile                   # optional — enables docker build sanity
#
#     gates-passed:                                    # REQUIRED — see below
#       needs: [ci]
#       if: always()
#       runs-on: ubuntu-latest
#       steps:
#         - env:
#             NEEDS: ${{ toJSON(needs) }}
#           run: |
#             bad="$(echo "$NEEDS" | jq -r 'to_entries[]
#               | select(.value.result != "success" and .value.result != "skipped")
#               | .key')"
#             [ -z "$bad" ] || { echo "::error::not green: $bad"; exit 1; }
#
# Setting any of api-path / app-path / terraform-path / dockerfile to "" (the
# default) skips that section. So pure-Windmill apps with no backend just set
# app-path; pure backends with no frontend just set api-path.
#
# ---------------------------------------------------------------------------
# WHY EVERY CALLER NEEDS ITS OWN `gates-passed` JOB
# ---------------------------------------------------------------------------
# The jobs in THIS file cannot be a required status check directly, for two
# reasons:
#
#   1. Every job here is conditional (`if: inputs.<path> != ''`). A repo with
#      no terraform/ would have to require a `terraform` check that never
#      succeeds. There is no single check name that is meaningful for all
#      adopters.
#   2. Jobs inside a reusable workflow surface PREFIXED by the caller's job
#      name — `ci / python`, `ci / frontend`. Jobs defined in the caller
#      surface BARE — `gates-passed`. `project-shepherd` and `mietanpassungen`
#      already require the bare name, so a caller-local job is what keeps ONE
#      check-name string across the whole org. That single string is what lets
#      an org-level ruleset gate every repo without per-repo configuration.
#
# A caller job that `uses:` this workflow already aggregates every inner job
# into one result, so `needs: [ci]` is sufficient — but ADD ANY CALLER-LOCAL
# JOBS to that `needs` list too, or they gate nothing. `feedback-hub` has a
# local `widget` job and must use `needs: [ci, widget]`.
#
# Two rules that are not obvious and both cost a real outage to learn:
#
#   * `skipped` PASSES, `cancelled` FAILS. A section whose path input is empty
#     has nothing to prove. A cancelled run never actually ran, so reporting
#     it green would merge untested code.
#   * NEVER add `paths:` filters to the caller's `pull_request:` trigger. If
#     the workflow does not run at all, the required check never reports and
#     every PR sits on "Expected — waiting for status" forever. Filter inside
#     jobs, never on the trigger of the workflow that owns the required check.
#
# Yes, this block is copy-pasted per repo, which this org otherwise avoids.
# It is the deliberate exception: it carries no security content and no
# app-specific logic, and if it ever drifts it fails loudly rather than
# silently passing. That is the opposite of the failure mode that makes
# copy-pasted prompts and permissions dangerous.

name: "PR (Python + TS, reusable)"

on:
  workflow_call:
    inputs:
      python-version:
        description: "Python version to install"
        type: string
        default: "3.12"
      node-version:
        description: "Node.js version to install"
        type: string
        default: "20"
      api-path:
        description: "Path to the Python backend (e.g. 'api'). Empty = skip backend jobs."
        type: string
        default: ""
      api-package:
        description: "uv workspace package name for tests (used in `uv run --package <name>`). Optional."
        type: string
        default: ""
      app-path:
        description: "Path to the frontend (e.g. 'app/object_details.raw_app'). Empty = skip frontend jobs."
        type: string
        default: ""
      terraform-path:
        description: "Path to terraform sources (e.g. 'terraform'). Empty = skip terraform job."
        type: string
        default: ""
      terraform-version:
        description: "Terraform version to install"
        type: string
        default: "1.7.5"
      dockerfile:
        description: "Path to Dockerfile relative to docker-context. Empty = skip docker build sanity job."
        type: string
        default: ""
      docker-context:
        description: "Docker build context directory"
        type: string
        default: "."

jobs:
  # --- Python backend -------------------------------------------------------
  python:
    if: inputs.api-path != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv (with cache)
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: uv sync
        run: uv sync --frozen

      - name: Ruff (lint)
        run: uv run ruff check ${{ inputs.api-path }}/src

      - name: Ruff (format check)
        run: uv run ruff format --check ${{ inputs.api-path }}/src

      - name: Pyright (typecheck)
        run: uv run pyright ${{ inputs.api-path }}/src

      - name: Pytest
        env:
          FRONTEND_SERVICE_SECRET: ci-no-auth-needed
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.api-package }}" ]; then
            uv run --package "${{ inputs.api-package }}" pytest "${{ inputs.api-path }}/tests/" -v
          else
            uv run pytest "${{ inputs.api-path }}/tests/" -v
          fi

  # --- Frontend (Vite + Vitest) ---------------------------------------------
  frontend:
    if: inputs.app-path != ''
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.app-path }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.app-path }}/package-lock.json

      # Use `npm install`, not `npm ci`. The new-app skill generates the
      # lock file on the engineer's machine (typically macOS arm64), which
      # records every esbuild optional platform package — including the
      # AIX/PPC64 one. `npm ci` runs in strict mode and tries to install
      # every lock-file entry, which fails on a linux-x64 runner with
      # `EBADPLATFORM` for the AIX entry (npm/cli#4828). Upgrading npm at
      # runtime is not a reliable workaround. `npm install` respects the
      # lock file when present and gracefully skips platform-incompatible
      # optional deps, which is what we want here.
      - run: npm install --no-audit --prefer-offline
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Vitest
        run: npm run test

  # --- Terraform (fmt + validate, no apply) ---------------------------------
  terraform:
    if: inputs.terraform-path != ''
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.terraform-path }}
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.terraform-version }}
          terraform_wrapper: false
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate

  # --- Docker build sanity (no push, GHA cache only) ------------------------
  docker:
    if: inputs.dockerfile != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build image (cache-only, no push)
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.docker-context }}
          file: ${{ inputs.dockerfile }}
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
