# Repo onboarder — makes the org standard unavoidable. When ANY repo is
# created (terminal, UI, API — the org webhook catches them all via the
# front-door API), this pushes the standard kit and sets the `sdlc` custom
# property so the org rulesets apply:
#   kit: AGENTS.md skeleton + CLAUDE.md (@AGENTS.md) + theo-pr-reviewer stub
#        + stub pr.yml (a gates-passed that blesses docs/config but FAILS the
#        moment code files land — it refuses to be a hollow green; owners
#        replace it with real CI then)
#   property: sdlc=floor when the stub gate was installed (PR-only AND
#             gates-passed required from birth); sdlc=baseline when the repo
#             arrived with its own pr.yml (a foreign check name must not
#             brick merges — graduate manually once gates-passed exists)
# Front-door-born repos are skipped — they get the full kit from the template.
# Idempotent: existing files are never overwritten; property only set if unset.

name: Onboard

on:
  repository_dispatch:
    types: [front-door-onboard]

permissions:
  contents: read

env:
  POSTHOG_SDLC_TOKEN: ${{ secrets.POSTHOG_SDLC_TOKEN }}

concurrency:
  group: onboard-${{ github.event.client_payload.repo }}
  cancel-in-progress: false

jobs:
  onboard:
    runs-on: ubuntu-latest
    steps:
      - name: Guard the payload (fail closed)
        env:
          REPO_IN: ${{ github.event.client_payload.repo }}
        run: |
          set -euo pipefail
          echo "$REPO_IN" | grep -Eq '^[A-Za-z0-9._-]{1,100}$' \
            || { echo "::error::repo name fails shape guard"; exit 1; }
          echo "REPO=$REPO_IN" >> "$GITHUB_ENV"

      - name: Mint onboarder token (theo-provisioner)
        id: app
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.PROVISIONER_APP_ID }}
          private-key: ${{ secrets.PROVISIONER_PRIVATE_KEY }}
          owner: hallo-theo

      - name: Skip if already standardized
        id: gate
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -euo pipefail
          if ! gh api "repos/hallo-theo/$REPO" >/dev/null 2>&1; then
            echo "::notice::repo vanished — nothing to onboard"; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          TOPICS=$(gh api "repos/hallo-theo/$REPO/topics" -q '.names | join(",")')
          PROP=$(gh api "repos/hallo-theo/$REPO/properties/values" -q '.[] | select(.property_name=="sdlc") | .value' 2>/dev/null || true)
          if [[ "$TOPICS" == *created-by-front-door* || -n "$PROP" ]]; then
            echo "::notice::already standardized (topics=$TOPICS prop=$PROP)"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Push the standard kit (never overwrites existing files)
        if: steps.gate.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -euo pipefail
          git clone -q "https://x-access-token:${GH_TOKEN}@github.com/hallo-theo/${REPO}.git" work
          cd work
          # brand-new repos may have an unborn default branch
          BRANCH=$(git symbolic-ref --short HEAD 2>/dev/null || echo main)
          git checkout -q -B "$BRANCH"
          ADDED=""
          if [ ! -f AGENTS.md ]; then
            cat > AGENTS.md <<'MD'
          # Agent guide

          <!-- Onboarded by the org standard (hallo-theo/.github onboard.yml).
               Owners / the context agent: replace the TBD sections. -->

          ## What this application does

          _TBD — describe purpose, users, and the systems it touches. Until
          then, agents must read the code before assuming anything._

          ## Working here

          - Every rule in this file must stay true — the org reviewer BLOCKS
            any PR that changes behavior these docs describe without updating
            them in the same PR (docs and code move atomically).
          - Merges happen only via PR, with a green `gates-passed` check (org
            rulesets). The onboarding stub gate in .github/workflows/pr.yml
            blesses docs/config but FAILS the moment code files land — replace
            it with real CI (lint + tests exposing a green `gates-passed` job)
            when that happens; snippets in hallo-theo/.github → sdlc/.

          ## Org context

          Org-wide platform and conventions: see `sdlc/ORG.md` in
          [hallo-theo/.github](https://github.com/hallo-theo/.github).
          UI (if any) follows the athena design standard — see
          `docs/DESIGN.md`; the org reviewer blocks divergence.
          MD
            ADDED="$ADDED AGENTS.md"
          fi
          if [ ! -f CLAUDE.md ]; then
            printf '@AGENTS.md\n' > CLAUDE.md
            ADDED="$ADDED CLAUDE.md"
          fi
          if [ ! -f docs/DESIGN.md ]; then
            mkdir -p docs
            cat > docs/DESIGN.md <<'MD'
          # Design standard — athena

          hallo theo's design system is **athena** (`hallo-theo/athena`).
          If (or when) this repo has a UI, it follows athena — the org
          reviewer BLOCKS UI that diverges. On the FIRST piece of UI work:

          1. Vendor the tokens next to your frontend entry:
             `gh api repos/hallo-theo/athena/contents/packages/tokens/index.css -q .content | base64 -d > <frontend-src>/athena-tokens.css`
          2. Import that file once and style EVERYTHING with its `:root`
             custom properties (`var(--...)`: colors, spacing, radius,
             shadows, type scale). No hardcoded hex colors, px-soups or
             invented shadows.
          3. Consult the rules in `design-system-md/` of `hallo-theo/athena`
             (46 files: colors, typography, control heights, …).

          The component library (`@hallo-theo/athena-ui`), design lint and
          fonts are private packages, not wired org-wide yet — do not add
          them ad hoc. No UI in this repo → nothing to do.
          MD
            ADDED="$ADDED DESIGN.md"
          fi
          if [ ! -f .github/workflows/claude-review.yml ]; then
            mkdir -p .github/workflows
            cat > .github/workflows/claude-review.yml <<'YML'
          name: Claude PR Review
          on:
            pull_request:
              types: [opened, synchronize, reopened]
          concurrency:
            group: claude-review-$[[ github.event.pull_request.number ]]
            cancel-in-progress: true
          jobs:
            review:
              permissions:
                contents: read
                pull-requests: write
              uses: hallo-theo/.github/.github/workflows/claude-review.yml@main
              secrets:
                PR_REVIEWER_PRIVATE_KEY: $[[ secrets.PR_REVIEWER_PRIVATE_KEY ]]
                # CI-agent spend rides its own LiteLLM virtual key (ci-agents) so agent
                # cost is attributable separately from product LLM calls (standard §8).
                LITELLM_API_KEY: $[[ secrets.LITELLM_CI_AGENTS_KEY ]]
          YML
            # \x7b = '{' , \x7d = '}' — dollar-brace-brace must never appear
            # literally in this file or GitHub's expression lexer rejects it.
            sed -i 's/\$\[\[/$\x7b\x7b/g; s/\]\]/\x7d\x7d/g' .github/workflows/claude-review.yml
            ADDED="$ADDED claude-review.yml"
          fi
          if [ ! -f .github/workflows/pr.yml ]; then
            mkdir -p .github/workflows
            cat > .github/workflows/pr.yml <<'YML'
          # Stub gate pushed by the org onboarder (hallo-theo/.github
          # onboard.yml). It runs real universal checks (workflow lint, secret
          # scan) and blesses docs/config — but it REFUSES to bless code: the
          # moment code files land in this repo the gate fails until you
          # replace this file with real CI (lint + tests) exposing a green
          # `gates-passed` job. Snippets: hallo-theo/.github -> sdlc/.
          name: PR
          on:
            pull_request:
              branches: [main]
          jobs:
            gates-passed:
              runs-on: ubuntu-latest
              timeout-minutes: 10
              steps:
                - uses: actions/checkout@v5
                  with:
                    fetch-depth: 0
                - name: Lint workflows (actionlint)
                  run: |
                    bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) 1.7.4 /tmp/al
                    /tmp/al/actionlint -color
                - name: Secret scan (gitleaks, full history)
                  run: |
                    curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
                      | tar -xz -C /tmp gitleaks
                    /tmp/gitleaks git --no-banner --redact --exit-code 1 .
                - name: Refuse to bless code without real CI
                  run: |
                    CODE=$(git ls-files | grep -Ev '^\.github/' \
                      | grep -E '\.(py|ts|tsx|js|jsx|go|rs|java|kt|swift|c|cc|cpp)$' || true)
                    if [ -n "$CODE" ]; then
                      echo "$CODE" | head -20
                      echo "::error::This repo contains code, but its gate is still the onboarding stub (no lint, no tests). Replace .github/workflows/pr.yml with real CI exposing a green gates-passed job — see hallo-theo/.github sdlc/README.md."
                      exit 1
                    fi
                    echo "No code files — stub gate honestly green (docs/config only)."
          YML
            ADDED="$ADDED pr.yml"
            # a required check now exists from birth -> the repo can start at
            # floor (PR-only AND gates-passed) instead of baseline
            echo "TIER=floor" >> "$GITHUB_ENV"
          fi
          if [ -z "$ADDED" ]; then
            echo "::notice::kit already complete — only setting the property"
          else
            git config user.name "theo-provisioner[bot]"
            git config user.email "theo-provisioner[bot]@users.noreply.github.com"
            git add -A
            git commit -q -m "Onboard to the org SDLC standard (kit:$ADDED)

          Pushed by onboard.yml in hallo-theo/.github. AGENTS.md/CLAUDE.md are
          the repo's living context; the org reviewer keeps them current."
            git push -q origin "HEAD:$BRANCH"
          fi
          echo "added:$ADDED"

      - name: Set the sdlc property (activates the org rulesets)
        if: steps.gate.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -euo pipefail
          # floor when the kit installed the stub gate (gates-passed exists
          # from birth); baseline when the repo arrived with its own pr.yml —
          # requiring a check name it may not expose would brick its merges.
          TIER="${TIER:-baseline}"
          ph() {
            [ -z "${POSTHOG_SDLC_TOKEN:-}" ] && return 0
            jq -n --arg e "$1" --arg d "$2" --argjson x "${3:-{}}" \
              '{api_key: env.POSTHOG_SDLC_TOKEN, event: $e, distinct_id: $d,
                properties: ($x + {app: "sdlc-workflows"})}' \
            | curl -s -o /dev/null -m 5 -X POST https://eu.i.posthog.com/capture/ \
                -H 'Content-Type: application/json' -d @- || true
          }
          ph sdlc_repo_onboarded "repo:$REPO" "{\"tier\": \"$TIER\"}"
          jq -n --arg t "$TIER" '{properties: [{property_name: "sdlc", value: $t}]}' \
            | gh api -X PATCH "repos/hallo-theo/$REPO/properties/values" --input - \
            && echo "✓ sdlc=$TIER" \
            || echo "::warning::could not set the sdlc property (App may need org Custom-properties permission) — set it manually"
