# Org skill registry — the SKILL.md bundles published to the LiteLLM gateway's
# skill hub (the Claude Code plugin marketplace behind the UI's Skills page).
#
# The hub stores a REFERENCE (repo + subdirectory), never a copy, so the repo
# stays the single source of truth and the gateway stays an index. sync.py
# registers these idempotently; it never deletes.
#
# WHAT BELONGS HERE: knowledge another repo's agent would benefit from.
# WHAT DOES NOT: the vendored Windmill CLI bundle (write-script-*, triggers,
# schedules, raw-app, cli-commands — 101 files org-wide, not ours), anything in
# theo-kreos-archive (an archive mirror), and repo-local dev tooling
# (shepherd-db-debugging, session-forensics, sync-debug, verify-agent-change).
#
# DUPLICATES RESOLVED (same skill in several repos — canonical choice here):
#   impower-api   -> hallotheo-claude-plugins (identical content; the
#                    distribution repo. project-shepherd keeps a local copy)
#   data-engineer -> dataops-claude-skills (identical; purpose-built shared
#                    repo, airflow-dags carries a consumer copy)
#   weg-recht,
#   mietverwaltung-> prosa-ai-chat (larger and actively maintained; prosa-demo
#                    holds a September snapshot)
#   replay-vision-* -> neither (repo-local analytics tooling)
#
# OWNERSHIP: legal and accounting content goes stale (Gesetze change) and an
# agent applying a stale rule confidently is worse than one with no rule.
# Each entry needs a named owner and a review cadence — add them as the
# owning teams confirm.

